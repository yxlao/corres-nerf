general {
    exp_root = logs
    recording = [
        ./src/corres,
        ./src/neus,
        ./src/tools
    ]
}

dataset {
    data_root = data/neus_dtu
    render_cameras_name = cameras_sphere.npz
    object_cameras_name = cameras_sphere.npz

    num_sparse_views = 3
    camera_split_path = configs/neus_dtu_camera_split.json

    corres_root = data_corres/neus_dtu
    corres_matcher = dkm
    corres_config = default
}

train {
    corres_enabled = True
    corres_confidence_enabled = True
    corres_confidence_normalized = False

    corres_dist_enabled = True
    corres_dist_tdist = 0.1
    corres_dist_weight = 0.1
    corres_dist_robust_ratio = 1.0

    corres_ds_enabled = True
    corres_ds_squared = False
    corres_ds_weight = 0.1
    corres_ds_robust_ratio = 1.0

    learning_rate = 5e-4
    learning_rate_alpha = 0.05
    end_iter = 300000

    batch_size = 512
    validate_resolution_level = 4
    warm_up_end = 5000
    anneal_end = 0
    use_white_bkgd = False

    save_freq = 10000
    val_freq = 5000
    val_mesh_freq = 5000
    report_freq = 100

    igr_weight = 0.1
    mask_weight = 0.0
}

model {
    nerf {
        D = 8,
        d_in = 4,
        d_in_view = 3,
        W = 256,
        multires = 10,
        multires_view = 4,
        output_ch = 4,
        skips=[4],
        use_viewdirs=True
    }

    sdf_network {
        d_out = 257,
        d_in = 3,
        d_hidden = 256,
        n_layers = 8,
        skip_in = [4],
        multires = 6,
        bias = 0.5,
        scale = 1.0,
        geometric_init = True,
        weight_norm = True
    }

    variance_network {
        init_val = 0.3,
    }

    rendering_network {
        d_feature = 256,
        mode = idr,
        d_in = 9,
        d_out = 3,
        d_hidden = 256,
        n_layers = 4,
        weight_norm = True,
        multires_view = 4,
        squeeze_out = True
    }

    neus_renderer {
        n_samples = 64,
        n_importance = 64,
        n_outside = 0,
        up_sample_steps = 4,     # 1 for simple coarse-to-fine sampling
        perturb = 1.0
    }
}
